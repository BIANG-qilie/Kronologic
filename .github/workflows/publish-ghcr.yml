name: Publish GHCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - src/**
      - public/**
      - scripts/**
      - drizzle/**
      - next.config.*
      - tsconfig.json
      - .github/workflows/publish-ghcr.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/biang-qilie/kronologic" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # User-owned package visibility (owner = github.repository_owner)
          OWNER="${{ github.repository_owner }}"
          PKG=kronologic
          gh api -X PUT "/user/packages/container/${PKG}/visibility" -f visibility=public \
            || gh api -X PUT "/users/${OWNER}/packages/container/${PKG}/visibility" -f visibility=public \
            || echo "Could not set visibility via API; set Public in GitHub Packages UI."
