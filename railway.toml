# Prefer Dockerfile (standalone + forced HOSTNAME=::) over Nixpacks.
# Rooms are in-memory — keep a single replica in the Railway UI.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Matches Dockerfile CMD; cwd is the standalone root (/app).
startCommand = "node server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[variables]
# Force bind even if the image/runtime sets HOSTNAME to the container id.
HOSTNAME = "::"
