# Prefer Dockerfile (standalone + forced HOSTNAME=0.0.0.0) over Nixpacks.
# Rooms are in-memory — keep a single replica in the Railway UI.
# Accounts (optional): add a Postgres service and set DATABASE_URL=${{Postgres.DATABASE_URL}}
# on this service in the UI. Migrations in ./drizzle run on boot (src/instrumentation.ts).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Matches Dockerfile CMD; cwd is the standalone root (/app).
startCommand = "node server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[variables]
# Force IPv4 bind even if the image/runtime sets HOSTNAME to the container id.
HOSTNAME = "0.0.0.0"
