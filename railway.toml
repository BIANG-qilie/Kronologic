# Minimal Railway config for Next.js (Nixpacks).
# Rooms are in-memory — keep a single replica.
# Next.js requires Node >=20.9; pin via NIXPACKS_NODE_VERSION (+ engines/.nvmrc).
[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[variables]
NIXPACKS_NODE_VERSION = "20"
